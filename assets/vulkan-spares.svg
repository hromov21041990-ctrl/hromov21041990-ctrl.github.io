<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Запчасти Vulkan</title>
  <desc id="desc">Графическое обозначение раздела запасных частей и комплектующих для котлов Vulkan</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20282c"/>
      <stop offset="1" stop-color="#485359"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="932" cy="400" r="188" fill="none" stroke="#f15a24" stroke-width="54" stroke-dasharray="150 45" opacity=".72"/>
  <circle cx="932" cy="400" r="75" fill="none" stroke="#f15a24" stroke-width="46" opacity=".8"/>
  <text x="88" y="290" fill="#fff" font-family="Arial, sans-serif" font-size="78" font-weight="700">VULKAN</text>
  <text x="88" y="390" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">ЗАПАСНЫЕ ЧАСТИ</text>
  <text x="88" y="470" fill="#e8ecee" font-family="Arial, sans-serif" font-size="30">Комплектующие и опции</text>
  <text x="88" y="520" fill="#e8ecee" font-family="Arial, sans-serif" font-size="30">для котлов Vulkan</text>
</svg>
