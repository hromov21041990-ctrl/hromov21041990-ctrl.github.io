<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Запчасти BIOTEP</title>
  <desc id="desc">Графическое обозначение раздела оригинальных запасных частей для котлов BIOTEP</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1119"/>
      <stop offset="1" stop-color="#d71920"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="932" cy="400" r="188" fill="none" stroke="#fff" stroke-width="54" stroke-dasharray="150 45" opacity=".2"/>
  <circle cx="932" cy="400" r="75" fill="none" stroke="#fff" stroke-width="46" opacity=".25"/>
  <text x="88" y="290" fill="#fff" font-family="Arial, sans-serif" font-size="78" font-weight="700">BIOTEP</text>
  <text x="88" y="390" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">ЗАПАСНЫЕ ЧАСТИ</text>
  <text x="88" y="470" fill="#ffe5e5" font-family="Arial, sans-serif" font-size="30">Оригинальные комплектующие</text>
